[project]
name = "rps-games"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.10.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.3",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
rps-games = "rps_games.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rps_games"]
